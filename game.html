<title>Moon not for Sale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Mise en page : une scène de théâtre nocturne. Bandeau d'état en haut, texte au centre comme un livret, choix en bas comme des répliques. Univers sombre assumé (une seule ambiance). */
:root{
  --nuit:#151a2c; --nuit-2:#1d2440; --nuit-3:#272f52; --craie:#ece7da; --craie-2:#b9b4a7;
  --lune:#f1dfa0; --or:#c9a54a; --maree:#79c7bb; --corail:#ef8a72; --brume:#9aa3c7; --ligne:#343d66;
  --f-titre:"Gloock", "Playfair Display", Georgia, serif;
  --f-texte:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-data:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0a1828;color:var(--craie);font-family:var(--f-texte);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse at 80% -10%, rgba(241,223,160,.10), transparent 55%);background-attachment:fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lune);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:14px 60px}
h1,h2,h3{font-family:var(--f-titre);font-weight:400;text-wrap:balance;letter-spacing:.01em;margin:0}
.eyebrow{font-family:var(--f-data);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brume)}
.btn{background:transparent;border:1px solid var(--ligne);border-radius:4px;padding:8px 14px;cursor:pointer;font-family:var(--f-data);font-size:13px;letter-spacing:.04em}
.btn:hover{border-color:var(--lune);color:var(--lune)}
.btn.primary{background:var(--lune);color:var(--nuit);border-color:var(--lune)}
.btn.primary:hover{filter:brightness(1.08);color:var(--nuit)}
/* ---------- écran titre ---------- */
[hidden]{display:none !important}
#title{display:grid;gap:16px;padding-top:0}
/* le bloc du titre se cale près du bord gauche, dans le ciel sombre */
.marquee,.panel{margin-left:calc(-1 * max(0px, (100vw - 1180px) / 2 - 4vw))}
.tabs{flex-wrap:nowrap;width:max-content}
.marquee{position:relative;z-index:1;max-width:min(560px,46vw);padding-top:clamp(16px,4vh,44px)}

.marquee h1,.marquee p{text-shadow:0 2px 14px rgba(5,10,24,.9)}
/* image d'accueil : couvre l'écran, calée à droite pour garder la Lune ; l'étiquette suit l'image */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;background:#0a1828}
.stage{position:absolute;right:0;top:50%;width:max(100vw,177.7vh);height:max(100vh,56.28vw);transform:translateY(-50%);background:center/100% 100% no-repeat}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,16,32,.55),rgba(8,16,32,0) 45%)}
.sold{position:absolute;left:86.9%;top:34.7%;transform:translate(-50%,-50%) rotate(-21.3deg) skewX(-3deg);font-family:var(--f-titre);font-size:max(1.2vw,2.13vh);letter-spacing:.12em;color:#9e3b29;opacity:.88;mix-blend-mode:multiply;white-space:nowrap;line-height:1}
#title{position:relative}
.marquee h1 s{text-decoration:line-through;text-decoration-thickness:.07em;text-decoration-color:var(--lune);opacity:.75}
.marquee h1{font-size:clamp(40px,5.2vw,74px);line-height:.95;color:var(--craie);white-space:nowrap}
.marquee h1 em{font-style:normal;color:var(--lune)}
.marquee p{max-width:62ch;color:var(--craie);margin:10px 0 0;font-size:15.5px;line-height:1.55}
.tabs{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:14px}
.tab{font-family:var(--f-data);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--craie-2);background:var(--nuit-2);border:1px solid var(--ligne);border-radius:4px;padding:9px 16px;cursor:pointer}
.tab:hover{color:var(--lune);border-color:var(--lune)}
.tab[aria-expanded="true"]{color:var(--nuit);background:var(--lune);border-color:var(--lune)}
.tabs .btn{margin-left:8px}
/* pas de barre de défilement visible, nulle part */
html{scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
.panel{position:relative;z-index:1;max-width:min(600px,46vw);background:rgba(10,18,38,.82);backdrop-filter:blur(6px);border:1px solid var(--ligne);border-radius:8px;padding:12px;animation:open .25s ease-out}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.home-rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.home-rules p{margin:0;background:rgba(29,36,64,.7);border:1px solid var(--ligne);border-radius:6px;padding:9px 11px;font-size:13px;line-height:1.4;color:var(--craie-2)}
.home-rules b{display:block;color:var(--lune);font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;font-weight:600}
.cast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc{background:rgba(29,36,64,.75);border:1px solid var(--ligne);border-radius:6px;padding:8px 10px;text-align:left;cursor:pointer;display:grid;gap:2px}
.pc:hover{border-color:var(--lune);background:var(--nuit-3)}
.pc h3{font-size:16px;line-height:1.15}
.pc .sp{font-family:var(--f-data);font-size:11px;color:var(--maree);letter-spacing:.08em;text-transform:uppercase}
.pc.locked{border-style:dashed;opacity:.75}.pc.locked h3{font-style:italic;font-size:14px;color:var(--craie-2)}
/* fiche du personnage */
#sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(10,13,24,.78);backdrop-filter:blur(3px)}
.sheet{width:min(920px,100%);max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:none;background:var(--nuit-2);border:1px solid var(--lune);border-radius:8px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);animation:open .25s ease-out}
.sheet::-webkit-scrollbar{display:none}
.sheet img{width:100%;height:100%;min-height:100%;object-fit:cover;display:block;border-radius:7px 0 0 7px}
.sheet .info{padding:22px 24px;display:grid;gap:10px;align-content:start}
.sheet h2{font-size:clamp(26px,3.4vw,34px);line-height:1.05;color:var(--lune)}
.sheet .sp{font-family:var(--f-data);font-size:12px;color:var(--maree);letter-spacing:.1em;text-transform:uppercase}
.sheet p{margin:0;font-size:15px;line-height:1.5;color:var(--craie-2)}
.sheet .tagline{color:var(--craie);font-style:italic}
.sheet .lab{font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--craie);display:block;margin-bottom:2px}
.sheet .stats{font-size:12px;gap:16px}
.sheet .row{margin-top:6px}
.stats{display:flex;gap:10px;font-family:var(--f-data);font-size:11px;color:var(--brume)}
.stats span b{color:var(--craie)}
.rules{display:grid;gap:10px;font-size:13.5px;line-height:1.45;color:var(--craie-2);background:var(--nuit-2);border:1px solid var(--ligne);border-radius:6px;padding:16px}
.rules b{display:block;color:var(--craie);font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px;font-weight:600}
.rules p{margin:0}
/* panneau permanent pendant la partie */
.game-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
#side{padding-top:26px;display:grid;gap:14px}
#side .rules{gap:8px;font-size:13px}
.side-box{background:var(--nuit-2);border:1px solid var(--ligne);border-radius:6px;padding:14px;display:grid;gap:8px}
.side-box h3{font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--craie);font-weight:600}
.side-box .empty{font-size:13px;color:var(--brume);margin:0}
.side-item{cursor:help;display:grid;gap:1px;font-size:13px;line-height:1.4;color:var(--craie-2);border-top:1px solid var(--ligne);padding-top:7px}
.side-item:first-of-type{border-top:0;padding-top:0}
.side-item strong{color:var(--craie);font-weight:600;font-size:14px}
.side-item .sp{font-family:var(--f-data);font-size:10px;color:var(--maree);letter-spacing:.08em;text-transform:uppercase}
/* ---------- jeu ---------- */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(21,26,44,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--ligne);padding-block:10px;display:grid;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nuit)}
.hud-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.who{font-family:var(--f-titre);font-size:20px}
.who small{font-family:var(--f-data);font-size:11px;color:var(--maree);letter-spacing:.1em;text-transform:uppercase;margin-left:8px}
.statline{display:flex;gap:14px;font-family:var(--f-data);font-size:13px;font-variant-numeric:tabular-nums}
.statline span{color:var(--brume)} .statline b{color:var(--craie)}
.gauges{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.gauge{display:grid;gap:3px;font-family:var(--f-data);font-size:11px;color:var(--brume);letter-spacing:.06em}
.gauge .bar{height:6px;background:var(--nuit-3);border-radius:3px;overflow:hidden}
.gauge .fill{height:100%;background:var(--maree);transition:width .5s}
.gauge.low .fill{background:var(--corail)}
.mor-eff{font-size:11px;color:var(--brume);letter-spacing:0}.mor-eff span{opacity:.7}.mor-eff.up{color:var(--maree)}.mor-eff.down{color:var(--corail)}
.gauge .lab{display:flex;justify-content:space-between}
.tools{display:flex;gap:6px}
.tools .btn{padding:4px 9px;font-size:11px}
#scene{padding-top:26px;display:grid;gap:18px}
.node-title{font-size:clamp(26px,4.5vw,36px);color:var(--lune)}
.node-id{font-family:var(--f-data);font-size:11px;color:var(--brume)}
.text p{margin:0 0 .8em;max-width:66ch}
.drift{font-family:var(--f-data);font-size:12px;color:var(--corail)}
.quip{border-left:2px solid var(--maree);padding:4px 0 4px 14px;color:var(--craie-2);font-style:italic;max-width:62ch}
.quip b{font-style:normal;color:var(--maree);font-family:var(--f-data);font-size:12px;letter-spacing:.06em;display:block}
.choices{display:grid;gap:10px;margin-top:6px}
.choice{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;text-align:left;background:var(--nuit-2);border:1px solid var(--ligne);border-radius:6px;padding:12px 14px;cursor:pointer}
.choice:hover{border-color:var(--lune);background:var(--nuit-3)}
.choice .lbl{min-width:0}
.choice .meta{font-family:var(--f-data);font-size:12px;color:var(--brume);text-align:right;white-space:nowrap}
.choice .meta b{color:var(--craie)}
.choice .tag{grid-column:1/-1;font-family:var(--f-data);font-size:11px;color:var(--maree);letter-spacing:.06em}
.hidden-count{font-family:var(--f-data);font-size:11px;color:var(--brume)}
/* jet de dé */
.roll{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--nuit-2);border:1px solid var(--ligne);border-radius:6px;padding:16px}
.die{width:86px;height:86px;display:grid;place-items:center;font-family:var(--f-titre);font-size:40px;color:var(--nuit);background:var(--craie);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.die.ok{background:var(--maree)} .die.ko{background:var(--corail)}
.die.spin{animation:spin .7s linear}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.die.spin{animation:none}.gauge .fill{transition:none}}
.xp{font-style:normal;opacity:.7;margin-left:2px;letter-spacing:1px}
.verdict{font-family:var(--f-data);font-size:13px;letter-spacing:.06em}
.verdict.ok{color:var(--maree)} .verdict.ko{color:var(--corail)}
.calc{font-family:var(--f-data);font-size:12px;color:var(--brume);font-variant-numeric:tabular-nums}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fx span{font-family:var(--f-data);font-size:11px;padding:2px 8px;border-radius:3px;background:var(--nuit-3)}
.fx .p{color:var(--maree)} .fx .m{color:var(--corail)}
.outcome{margin:.4em 0 0}
/* ---------- images des lieux : bandeau net en haut de la scène, même image floutée en fond ---------- */
.loc-bg{position:fixed;inset:-24px;z-index:0;pointer-events:none;background:#0a1828 center/cover no-repeat;filter:blur(3px) brightness(.62) saturate(.95);transition:background-image .6s}
.game-grid{position:relative;z-index:1}
.loc-band{margin:26px 0 0;position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--ligne);aspect-ratio:16/6;background:var(--nuit-2)}
.loc-band img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s}
.loc-band img.on{opacity:1}
.loc-band{z-index:1;margin-top:12px;max-height:46vh;width:100%}
#scene{gap:14px}
.node-title{font-size:clamp(24px,3vw,32px)}
.choice{padding:10px 14px}
.choices{gap:8px}
#col{min-width:0}
#scene{margin-top:12px}
#side{padding-top:12px}
.text p,.quip,.outcome{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.text p{max-width:none}
.quip{max-width:none}
#game .who{display:flex;align-items:center;gap:10px}
.who-pic{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--lune);flex:none}
.gauges{align-items:end}
.gauge .lab em{font-style:normal;margin-left:6px}
#game ~ *, .wrap:has(#game:not([hidden])){padding-bottom:16px}
#scene > div:empty{display:none}
/* ---------- barre du haut : médaillon, nom, jauges, caractéristiques ---------- */
#hud{display:block;padding-inline:14px}
.game-grid{column-gap:12px}
.hud-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hud-bar .who{display:flex;align-items:center;gap:12px;font-family:var(--f-titre);font-size:20px;min-width:0;background:none;border:0;color:inherit;padding:0;cursor:pointer;text-align:left}
.hud-bar .who small{margin-left:0;display:block}
.hud-bar .who .nm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.face{width:52px;height:52px;border-radius:50%;flex:none;border:2px solid var(--or);background-color:var(--nuit-3);background-repeat:no-repeat;box-shadow:0 0 0 3px rgba(201,165,74,.18)}
.gold-sep{width:2px;align-self:stretch;min-height:44px;background:linear-gradient(180deg,transparent,var(--or) 20%,var(--or) 80%,transparent);flex:none}
.hud-bar .gauges{display:grid;grid-template-columns:1fr;gap:6px;flex:1 1 260px;min-width:200px}
.hud-bar .stack{display:grid;gap:2px;font-family:var(--f-data);font-size:12px;font-variant-numeric:tabular-nums;min-width:130px}
.hud-bar .stack span{display:flex;justify-content:space-between;gap:10px;color:var(--brume);cursor:help}
.hud-bar .stack b{color:var(--craie)}
.hud-bar .stack em{font-style:normal;color:var(--or);margin-left:4px}
@media (max-width:640px){ #hud{position:static} .gold-sep{display:none} .hud-bar .stack{grid-auto-flow:column;gap:12px} .face{width:44px;height:44px} }
/* ---------- médaillons de l'équipe et des objets ---------- */
.meds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.med{display:grid;justify-items:center;gap:5px;background:none;border:0;padding:0;color:var(--craie-2);font:inherit;font-size:11px;line-height:1.2;text-align:center;cursor:help}
.med .pic{width:100%;aspect-ratio:1;max-width:76px;background:var(--nuit-3) center/cover no-repeat;border:2px solid var(--or);transition:transform .15s, box-shadow .15s}
.med.rond .pic{border-radius:50%}
.med.carre .pic{border-radius:8px;border-color:var(--or)}
.med:hover .pic,.med:focus-visible .pic{transform:scale(1.06);box-shadow:0 0 0 3px rgba(241,223,160,.25)}
.med:focus-visible{outline:none}
.med .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#card{position:fixed;z-index:30;width:min(560px,calc(100vw - 32px));pointer-events:none;background:var(--nuit-2);border:1px solid var(--lune);border-radius:8px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:0;box-shadow:0 18px 50px rgba(0,0,0,.5);animation:open .15s ease-out}
#card[hidden]{display:none}
#card .big{margin:18px 0 18px 18px;width:132px;height:132px;background:var(--nuit-3) center/cover no-repeat;border:2px solid var(--or)}
#card.rond .big{border-radius:50%} #card.carre .big{border-radius:10px}
#card .info{padding:18px 20px;display:grid;gap:8px;align-content:start}
#card h2{font-size:24px;line-height:1.1;color:var(--lune)}
#card .sp{font-family:var(--f-data);font-size:11px;color:var(--maree);letter-spacing:.1em;text-transform:uppercase}
#card p{margin:0;font-size:14px;line-height:1.5;color:var(--craie-2)}
#card .lab{font-family:var(--f-data);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--craie);display:block;margin-bottom:2px}
@media (max-width:520px){ #card{grid-template-columns:1fr} #card .big{margin:16px auto 0;width:110px;height:110px} }
/* blocs de lecture légèrement transparents : on devine l'image derrière */
#scene{background:rgba(14,20,40,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--ligne);border-radius:8px;padding:20px 22px 22px}
#hud{background:rgba(21,26,44,.84)}
.side-box{background:rgba(24,30,56,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.choice{background:rgba(29,36,64,.7)}
.choice:hover{background:rgba(39,47,82,.85)}
.roll{background:rgba(29,36,64,.7)}
/* fin */
.ending{border:1px solid var(--lune);border-radius:8px;padding:24px;display:grid;gap:14px;background:linear-gradient(180deg,rgba(241,223,160,.06),transparent)}
.ending .num{font-family:var(--f-data);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--lune)}
.ending h2{font-size:clamp(32px,6vw,52px)}
.row{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:1000px){
  .game-grid{grid-template-columns:1fr}
  .sheet{grid-template-columns:1fr;width:min(520px,100%)}
  .sheet img{border-radius:7px 7px 0 0;height:auto;min-height:0;aspect-ratio:1;max-height:46vh}
  #side{padding-top:0}
}
@media (max-width:620px){
  .loc-band{aspect-ratio:2/1;margin-top:14px}
  #scene{padding:16px 14px 18px}
}
@media (max-aspect-ratio:1/1){
  .marquee,.panel{margin-left:0}
  .tabs{flex-wrap:wrap;width:auto}
  .bg{position:absolute;top:0;left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));bottom:auto;height:min(112.5vw,62vh);margin-top:-14px}
  .stage{top:0;transform:none;height:100%;width:calc(min(112.5vw,62vh) * 1.7768)}
  .stage::after{background:linear-gradient(180deg,rgba(10,24,40,0) 55%,#0a1828)}
  .sold{font-size:calc(min(112.5vw,62vh) * 1.7768 * .012)}
  .marquee{max-width:none;padding-top:calc(min(112.5vw,62vh) - 70px)}
  .panel{max-width:none}
}
@media (max-width:620px){
  .tabs .btn{margin-left:0}
  .cast{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-rules{grid-template-columns:1fr}
  .marquee h1{font-size:44px}
  .gauges{grid-template-columns:1fr}
  .choice{grid-template-columns:1fr}
  .choice .meta{text-align:left}
  .roll{grid-template-columns:1fr;justify-items:start}
}
</style>

<div class="wrap">
  <section id="title">
    <div class="bg" aria-hidden="true"><div class="stage" id="stage"><span class="sold">VENDU</span></div></div>
    <div class="marquee">
      <div>
        <h1 aria-label="Moon not for Sale, le mot « not » est barré">Moon <s>not</s> for <em>Sale</em></h1>
        <p>Un promoteur venu d'Aldébaran a acheté la Lune, légalement, avec des pâtisseries. Il a planté un crochet dedans et commence à l'emporter. Sur la Terre, les marées s'affolent, les rêves s'éteignent, les horloges s'arrêtent et l'Axe penche. Quelqu'un doit monter.</p>
        <nav class="tabs" aria-label="Accueil">
      <button class="tab" id="tabRegles" aria-expanded="false" aria-controls="panelRegles">Règles du jeu</button>
      <button class="tab" id="tabCommencer" aria-expanded="false" aria-controls="panelCommencer">Commencer</button>

    </nav>
      </div>
    </div>
    <section class="panel" id="panelRegles" aria-label="Règles du jeu" hidden><div class="home-rules" id="rules"></div></section>
    <section class="panel" id="panelCommencer" aria-label="Choisis ton personnage" hidden><div class="cast" id="cast"></div></section>
    <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName" hidden></div>
  </section>

  <section id="game" hidden>
    <div class="loc-bg" id="locBg" aria-hidden="true"></div>
    <header id="hud"></header>
    <figure class="loc-band" id="locBand" hidden><img id="locImg" alt="" decoding="async"></figure>
    <div class="game-grid">
      <div id="col"><div id="scene"></div></div>
      <aside id="side" aria-label="Ton équipe, tes objets et les règles"></aside>
    </div>
  </section>
</div>


<div id="card" role="tooltip" hidden></div>
<script>
const TITLES=["Maître","Colonelle","Colonel","Sœur","Lord","Madame","Monsieur","Sire","Comtesse","Dame","Tante","Dr","Grand-Père","Capitaine","Le"];
function shortName(n){ return n.split(" ").find(w => !TITLES.includes(w)) || n; }
const DATA = /*__DATA__*/null;
const M = DATA.meta, N = DATA.nodes, SN = M.statNames, STATS = ["pan","rus","coe"];
const XP_STEP = 3, STAT_MAX = 5, COMP_BONUS = 1, COMP_MAX = 2;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let S = null;      // état de la partie
let showIds = store.get("lune.ids", false);

/* ---------- logique (miroir du compilateur) ---------- */
function check(cond){
  if (cond.includes(",")){
    if (cond.startsWith("!")) return !cond.slice(1).split(",").some(check);
    return cond.split(",").some(check);
  }
  const neg = cond.startsWith("!"); const c = neg ? cond.slice(1) : cond; let r;
  if (c.includes(":")){
    const [k, v] = c.split(/:(.*)/s);
    if (k === "comp") r = S.comp.includes(v);
    else if (k === "flag") r = S.flags.includes(v);
    else if (k === "pc") r = S.pc === v;
    else if (k === "last") r = S.last === v;
    else if (k === "from") r = S.prev === v;
    else r = false;
  } else {
    const m = c.match(/^(\w+)(>=|<=|>|<|==)(-?\d+)$/); if (!m) return false;
    const a = m[1] === "comps" ? S.comp.length : (S.vars[m[1]] || 0), b = +m[3];
    r = ({">=":a>=b,"<=":a<=b,">":a>b,"<":a<b,"==":a==b})[m[2]];
  }
  return neg ? !r : r;
}
const allOk = arr => arr.every(check);
function apply(fx, log){
  for (const e of fx){
    if (e.includes("=>")){ const [c, eff] = e.split("=>"); if (check(c)) apply([eff], log); continue; }
    if ((e[0] === "+" || e[0] === "-") && e.includes(":")){
      const [k, v] = e.slice(1).split(/:(.*)/s); const add = e[0] === "+";
      const arr = k === "comp" ? S.comp : S.flags;
      const item = k === "flag" && M.items && M.items[v];
      if (add && !arr.includes(v)){ arr.push(v); if (k === "comp" && log) log.push({t:`${M.companions[v].name} rejoint ton équipe`, p:true}); if (item && log) log.push({t:`Objet obtenu : ${item.name}`, p:true}); }
      if (!add){ const i = arr.indexOf(v); if (i >= 0){ arr.splice(i,1); if (k === "comp" && log) log.push({t:`${M.companions[v].name} te quitte`, p:false}); if (item && log) log.push({t:`Objet utilisé ou donné : ${item.name}`, p:false}); } }
      continue;
    }
    const m = e.match(/^(\w+)([+\-=])(\d+)$/); if (!m) continue;
    const k = m[1], n = +m[3]; let v = S.vars[k] || 0; const old = v;
    v = m[2] === "+" ? v + n : m[2] === "-" ? v - n : n;
    if (k === "equ") v = Math.max(0, Math.min(100, v));
    if (k === "mor") v = Math.max(0, Math.min(10, v));
    if (STATS.includes(k) && m[2] === "+"){
      // progression lente : 3 points d'expérience = +1 dans la caractéristique (max 5)
      S.xp = S.xp || {}; let xp = (S.xp[k] || 0) + n; let s = S.vars[k] || 0;
      while (xp >= XP_STEP && s < STAT_MAX){ xp -= XP_STEP; s++; }
      S.xp[k] = s < STAT_MAX ? xp : 0; S.vars[k] = s;
      if (log){
        if (s > old) log.push({t:`+${s-old} ${SN[k]}`, p:true});
        else if (s < STAT_MAX) log.push({t:`expérience ${SN[k]} ${S.xp[k]}/${XP_STEP}`, p:true});
      }
      continue;
    }
    if (STATS.includes(k)) v = Math.max(0, Math.min(STAT_MAX, v));
    S.vars[k] = v;
    if (log && v !== old && ["equ","mor",...STATS].includes(k)){
      const name = k === "equ" ? "Équilibre" : k === "mor" ? "Moral" : SN[k];
      log.push({t:`${v>old?"+":"−"}${Math.abs(v-old)} ${name}`, p:v>old});
    }
  }
}
function statFor(ch){
  if (ch.stat !== "any") return ch.stat;
  return STATS.reduce((a, b) => (S.vars[b] > S.vars[a] ? b : a), "pan");
}
function bonusFor(stat){
  const parts = [{l:SN[stat], v:S.vars[stat]||0}];
  let cb = 0;
  for (const c of S.comp) if (M.companions[c].stat === stat && cb < COMP_MAX){ parts.push({l:shortName(M.companions[c].name), v:COMP_BONUS}); cb += COMP_BONUS; }
  const m = S.vars.mor; if (m >= 8) parts.push({l:"Moral", v:1}); else if (m <= 2) parts.push({l:"Moral", v:-1});
  return parts;
}
// 1 naturel : toujours un échec ; 20 naturel : toujours une réussite
const chance = (diff, bonus) => Math.max(5, Math.min(95, (21 - (diff - bonus)) * 5));
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- écran titre ---------- */
const IMG_DIR = "img/personnages/";
function portraitFallback(p){
  const hue = [...p.id].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><defs><radialGradient id="g" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="hsl(${hue},35%,38%)"/><stop offset="1" stop-color="#151a2c"/></radialGradient></defs><rect width="96" height="96" fill="url(#g)"/><circle cx="74" cy="20" r="9" fill="#f1dfa0" opacity=".85"/><text x="48" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="40" fill="#ece7da">${esc(shortName(p.name)[0])}</text></svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}
function rulesHtml(short){
  const nC = Object.keys(M.companions).length, nI = Object.keys(M.items || {}).length;
  const R = [
    ["Le dé", short ? "Une action risquée : d20 + ta caractéristique (+1 par compagnon spécialiste, +2 au plus) contre la difficulté. 1 rate, 20 réussit." :
      "Une action risquée se joue au d20 + ta caractéristique (Panache, Ruse ou Cœur), +1 par compagnon spécialiste (+2 au plus), contre la difficulté affichée. Un 1 rate, un 20 réussit. Trois points d'expérience font monter une caractéristique de 1, jusqu'à 5."],
    ["Les compagnons", short ? "Chacun ouvre des choix et en ferme d'autres. Certains ne voyagent pas ensemble, certains peuvent partir." :
      `${nC} personnages peuvent te suivre. Chacun ouvre des choix et en ferme d'autres. Certains ne voyagent pas ensemble, d'autres partent si tu les heurtes.`],
    ["Le moral", short ? "À 8 ou plus : +1 à tous tes dés. À 2 ou moins : −1." :
      "Il monte quand tu prends soin des autres et baisse sur un échec cuisant. À 8 ou plus, +1 à tous tes dés ; à 2 ou moins, −1."],
    ["Les objets", short ? "Ils font apparaître des choix plus loin. Certains ne servent qu'une fois." :
      `${nI} objets sont cachés dans le monde. Chacun fait apparaître, plus loin, des choix qui n'existeraient pas sans lui.`],
    ["L'équilibre", short ? "La Terre en perd à chaque étape. Sous 30 au moment final, seules les fins sombres restent." :
      "La Terre en perd à chaque étape, tes réussites lui en rendent. Sous 30 au moment final, seules les fins sombres restent. Il y a " + Object.keys(M.endings).length + " fins, et des héros qui se dévoilent au fil des parties."]
  ];
  return R.map(([t, d]) => `<p><b>${t}</b>${esc(d)}</p>`).join("");
}
function gamesDone(){
  // parties terminées : compteur, ou à défaut une par couple (fin, héros) déjà atteint
  const got = store.get("lune.ends", {});
  const pairs = Object.values(got).reduce((a, v) => a + v.length, 0);
  return Math.max(store.get("lune.parties", 0), pairs);
}
function isLocked(p){ return (p.unlock || 0) > gamesDone(); }
function renderCast(){
  $("#cast").innerHTML = M.playables.map(p => isLocked(p)
    ? `<button class="pc locked" data-pc="${p.id}" title="${esc(p.locked || "")}"><span class="sp">? ? ?</span><h3>${esc(p.locked || "Un personnage caché")}</h3></button>`
    : `<button class="pc" data-pc="${p.id}"><span class="sp">${esc(p.species)}</span><h3>${esc(p.name)}</h3></button>`).join("");
  document.querySelectorAll(".pc").forEach(b => b.onclick = () => { const p = M.playables.find(x => x.id === b.dataset.pc); if (isLocked(p)) showLocked(b, p); else openSheet(b.dataset.pc); });
  $("#rules").innerHTML = rulesHtml(true);
  $("#btnResume").hidden = !store.get("lune.save", null);
}
function showLocked(b, p){
  const n = p.unlock || 0;
  b.querySelector("h3").textContent = `Termine ${n === 1 ? "une partie" : n + " parties"}, avec n'importe quel héros, pour découvrir qui se cache ici.`;
}
function openSheet(id, inGame){
  const p = M.playables.find(x => x.id === id), el = $("#sheet");
  el.innerHTML = `<div class="sheet">
    <img src="${(DATA.portraits || {})[p.id] || portraitFallback(p)}" alt="Portrait de ${esc(p.name)}">
    <div class="info">
      <span class="sp">${esc(p.species)}</span>
      <h2 id="sheetName">${esc(p.name)}</h2>
      <p class="tagline">${esc(p.tagline)}</p>
      <p><span class="lab">Le personnage</span>${esc(p.bio)}</p>
      <p><span class="lab">Où tu commences</span>${esc(p.debut)}</p>
      <span class="stats">${STATS.map((s,i)=>`<span>${SN[s]} <b>${p.stats[i]}</b></span>`).join("")}</span>
      <div class="row">${inGame ? `<button class="btn" id="sheetBack">Quitter vers l'écran titre</button><button class="btn primary" id="sheetGo">Reprendre la partie</button>` : `<button class="btn" id="sheetBack">Choisir un autre personnage</button><button class="btn primary" id="sheetGo">Commencer</button>`}</div>
    </div></div>`;
  el.hidden = false;
  const close = () => { el.hidden = true; el.innerHTML = ""; document.removeEventListener("keydown", onKey); $(`.pc[data-pc="${id}"]`)?.focus(); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  el.onclick = e => { if (e.target === el) close(); };
  $("#sheetBack").onclick = inGame ? () => { close(); showTitle(); } : close;
  $("#sheetGo").onclick = inGame ? close : () => { close(); newGame(id); };
  $("#sheetGo").focus({preventScroll: true});
}
function bindTabs(){
  const tabs = [["#tabRegles", "#panelRegles"], ["#tabCommencer", "#panelCommencer"]];
  tabs.forEach(([t, pnl]) => $(t).onclick = () => {
    const open = $(t).getAttribute("aria-expanded") !== "true";
    tabs.forEach(([t2, p2]) => { $(t2).setAttribute("aria-expanded", "false"); $(p2).hidden = true; });
    if (open){ $(t).setAttribute("aria-expanded", "true"); $(pnl).hidden = false; }
  });
}
function newGame(pcId){
  const p = M.playables.find(x => x.id === pcId);
  S = {pc:p.id, node:p.start, comp:[], flags:[], vars:{pan:p.stats[0],rus:p.stats[1],coe:p.stats[2],equ:M.start.equ,mor:M.start.mor}, steps:0, phase:"node", entered:false, met:[]};
  enterNode(p.start);
}
function showGame(){ $("#title").hidden = true; $("#game").hidden = false; }
function showTitle(){ $("#title").hidden = false; $("#game").hidden = true; renderCast(); window.scrollTo(0,0); }

/* ---------- déroulé ---------- */
function enterNode(id){
  S.node = id; S.phase = "node"; S.drift = [];
  const n = N[id];
  const log = []; apply(n.fx, log); S.drift = log.filter(l => !l.p);
  S.quips = pickQuips(n);
  if (n.end){ store.set("lune.parties", gamesDone() + 1); const got = store.get("lune.ends", {}); got[n.end] = got[n.end] || []; if (!got[n.end].includes(S.pc)) got[n.end].push(S.pc); store.set("lune.ends", got); store.set("lune.save", null); }
  else store.set("lune.save", S);
  render(); window.scrollTo({top:0});
}
function pickQuips(n){
  const out = [], seen = new Set();
  /* la première réplique qui colle, par compagnon ; on garde d'abord les échanges entre compagnons et les répliques liées à la situation, puis on tire au hasard */
  for (const q of (n.quips || [])){
    if (seen.has(q.c) || !S.comp.includes(q.c) || !allOk(q.if)) continue;
    seen.add(q.c); out.push(q);
  }
  const prio = q => (q.if || []).some(c => /^!?comp:|,comp:/.test(c)) ? 2 : (q.if || []).length ? 1 : 0;
  return out.map(q => [q, prio(q) + Math.random()]).sort((x, y) => y[1] - x[1]).slice(0, 2).map(x => x[0]);
}
/* un compagnon commente ta façon d'agir après un jet (une fois sur deux environ) ; de préférence le spécialiste de la caractéristique */
function pickReact(stat, ok){
  const R = DATA.reactions; if (!R || !stat || !S.comp.length || Math.random() < 0.45) return null;
  const all = S.comp.filter(c => R[c] && R[c][stat]); if (!all.length) return null;
  const fresh = all.filter(c => c !== S.lastReact); const base = fresh.length ? fresh : all;
  const spec = base.filter(c => M.companions[c].stat === stat);
  const pool = spec.length && Math.random() < 0.6 ? spec : base;
  const c = pool[Math.floor(Math.random() * pool.length)]; S.lastReact = c;
  return {c, t: R[c][stat][ok ? 0 : 1]};
}
function choose(i){
  const n = N[S.node]; const ch = visibleChoices(n)[i];
  const auto = ch.stat === "auto";
  const stat = auto ? null : statFor(ch); const parts = auto ? [] : bonusFor(stat); const bonus = parts.reduce((a,b)=>a+b.v,0);
  const die = auto ? 0 : 1 + Math.floor(Math.random() * 20);
  const ok = auto ? true : die === 20 ? true : die === 1 ? false : die + bonus >= ch.diff;
  const log = []; const d = M.defaults;
  // échec cuisant : un 1, ou raté de 6 points ou plus. Seul cas où l'échec coûte du Moral par défaut.
  const heavy = !auto && !ok && (die === 1 || die + bonus <= ch.diff - 6);
  if (heavy && !ch.kofx.length) log.push({t:"échec cuisant", p:false});
  apply(auto ? (ch.okfx.length ? ch.okfx : (d.autofx || [])) : ok ? (ch.okfx.length ? ch.okfx : d.okfx) : (ch.kofx.length ? ch.kofx : (heavy ? d.kofx : [])), log);
  const text = ok ? ch.ok : ch.ko;
  S.phase = "roll"; S.roll = {label: ch.label, auto, die, bonus, parts, diff: ch.diff, ok, text, log, react: null, to: ch.to, stat, from: S.node};
  S.steps++;
  store.set("lune.save", S);
  render(!auto);
}
// Étiquette d'un choix conditionnel : seulement pour une condition positive qui est vraie maintenant
// (un compagnon présent, un objet porté, ton personnage, un acte passé). Les gardes négatives et les compteurs n'en ont pas.
const ROUTING = /^(vis_|stand_|n_)|_vu$/;
function gateTag(c){
  const parts = c.if.filter(x => !x.startsWith("!")).flatMap(x => x.split(",")).filter(x => !x.startsWith("!") && check(x));
  const comps = parts.filter(x => x.startsWith("comp:")).map(x => shortName(M.companions[x.slice(5)].name));
  if (comps.length) return `Grâce à ${comps.join(", ")}`;
  const items = parts.filter(x => x.startsWith("flag:obj_")).map(x => M.items[x.slice(5)].name);
  if (items.length) return `Grâce à : ${items.join(", ")}`;
  if (parts.some(x => x.startsWith("pc:"))) return `Parce que tu es ${shortName(M.playables.find(p => p.id === S.pc).name)}`;
  if (parts.some(x => x.startsWith("flag:") && !ROUTING.test(x.slice(5)))) return `Grâce à ce que tu as fait plus tôt`;
  return "";
}
function visibleChoices(n){ return n.choices.filter(c => allOk(c.if)); }

/* ---------- rendu ---------- */
/* recadrage sur le visage des portraits (centre x, y en fraction de l'image) */
const FACE = {president:[.5,.45], platine:[.5,.3], ondine:[.33,.13], basile:[.52,.42], pistil:[.53,.2], brisefer:[.46,.2], zephyrin:[.4,.2], griselidis:[.55,.22], pelagie:[.42,.25], barnabe:[.42,.21], anatole:[.48,.27]};
function faceStyle(p){
  const src = (DATA.portraits || {})[p.id] || portraitFallback(p);
  const [x, y] = FACE[p.id] || [.5, .3], w = .3, cl = v => Math.max(0, Math.min(1 - w, v - w / 2)) / (1 - w) * 100;
  return `background-image:url('${src}');background-size:${100 / w}%;background-position:${cl(x)}% ${cl(y)}%`;
}
/* bonus des compagnons spécialistes, +2 au plus par caractéristique */
function compBonus(st){ return Math.min(2, S.comp.filter(c => M.companions[c] && M.companions[c].stat === st).length); }
function hud(){
  const p = M.playables.find(x => x.id === S.pc);
  const e = S.vars.equ, m = S.vars.mor;
  return `
  <div class="hud-bar">
    <button class="who" id="tWho" title="Ta fiche (et retour à l'écran titre)"><span class="face" style="${faceStyle(p)}"></span><span class="nm">${esc(p.name)}<small>${esc(p.species)}</small></span></button>
    <span class="gold-sep" aria-hidden="true"></span>
    <div class="gauges">
      <div class="gauge ${e<30?"low":""}" title="${esc(M.gauges.equ.help)}"><div class="lab"><span>ÉQUILIBRE DE LA TERRE</span><span>${e}/100</span></div><div class="bar"><div class="fill" style="width:${e}%"></div></div></div>
      <div class="gauge ${m<=2?"low":""}" tabindex="0" title="${esc(M.gauges.mor.help)} À 8 ou plus : +1 aux dés. À 2 ou moins : −1."><div class="lab"><span>MORAL${m>=8?` <em class="mor-eff up">+1 aux dés</em>`:m<=2?` <em class="mor-eff down">−1 aux dés</em>`:""}</span><span>${m}/10</span></div><div class="bar"><div class="fill" style="width:${m*10}%"></div></div></div>
    </div>
    <span class="gold-sep" aria-hidden="true"></span>
    <div class="stack">${STATS.map(st => { const bo = compBonus(st), who = S.comp.filter(c => M.companions[c] && M.companions[c].stat === st).map(c => shortName(M.companions[c].name));
      return `<span title="${esc(M.statHelp[st])} Expérience : ${(S.xp||{})[st]||0}/3.${bo ? ` Bonus de ${who.join(", ")} : +${bo} aux jets.` : ""}">${SN[st]} <b>${S.vars[st]}${bo ? `<em>+${bo}</em>` : ""}</b></span>`; }).join("")}</div>
  </div>
`;
}
const MED_HUE = id => [...id].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 360;
/* médaillon provisoire tant que l'image n'existe pas : rond pour un compagnon, carré pour un objet */
function medFallback(id, name, round){
  const h = MED_HUE(id), letter = esc((name.replace(/^(L'|La |Le |Les |Un |Une |Des |Dr |Docteur |Madame |Monsieur |Tante |Capitaine |Comtesse |Dame |Sire |Colonel |Grand-Père |Archibald )+/, "")[0] || "?").toUpperCase());
  const svg = round
    ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><defs><radialGradient id="g" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="hsl(${h},38%,40%)"/><stop offset="1" stop-color="#151a2c"/></radialGradient></defs><rect width="96" height="96" fill="url(#g)"/><text x="48" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="40" fill="#ece7da">${letter}</text></svg>`
    : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" fill="#f1dfa0"/><rect x="10" y="10" width="76" height="76" rx="6" fill="none" stroke="#a8862f" stroke-width="2" stroke-dasharray="4 4"/><text x="48" y="61" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#6e5520">${letter}</text></svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}
function medImg(kind, id, name){ return ((DATA.meds || {})[kind] || {})[id] || (kind === "c" && (DATA.portraits || {})[id]) || medFallback(id, name, kind === "c"); }
const CROISSANT = {name:"Le petit Croissant", species:"Bébé tortue des sables", bio:"Né la dernière nuit, à marée haute, quand la Lune tirait la mer jusqu'au bord de la plaine. Il est très lent, très curieux, et il regarde la Lune avec des yeux énormes. Sa mère l'a appelé comme la Lune quand elle commence."};
function medCard(kind, id){
  if (kind === "c"){
    if (id === "croissant") return {round:true, img:medImg("c", id, CROISSANT.name), sp:CROISSANT.species, name:CROISSANT.name, rows:[["Qui c'est", CROISSANT.bio], ["Avec toi", S.comp.includes("coquille") ? "Sur le dos de sa mère, Madame Coquille." : "Dans tes bras. Il va falloir qu'il vive pour deux."]]};
    const k = M.companions[id];
    return {round:true, img:medImg("c", id, k.name), sp:k.species, name:k.name, rows:[["Qui c'est", k.bio], ["Son talent", `+1 à tes jets de ${SN[k.stat]} tant que ${shortName(k.name)} t'accompagne (deux spécialistes au plus comptent).`]]};
  }
  const it = M.items[id];
  return {round:false, img:medImg("o", id, it.name), sp:"Objet", name:it.name, rows:[["Ce que c'est", it.desc], ["À quoi ça sert", "Il fera apparaître, plus loin, un choix qui n'existerait pas sans lui. Certains ne servent qu'une fois."]]};
}
function medHtml(kind, id, name){
  return `<button class="med ${kind === "c" ? "rond" : "carre"}" data-k="${kind}" data-id="${id}" aria-label="${esc(name)}"><span class="pic" style="background-image:url('${medImg(kind, id, name)}')"></span><span class="nm">${esc(kind === "c" ? (id === "croissant" ? "Croissant" : shortName(name)) : name)}</span></button>`;
}
function sideHtml(){
  const ids = [...S.comp];
  /* le petit Croissant voyage avec sa mère, ou avec toi si elle n'est plus là */
  if (S.flags.includes("croissant") && (S.comp.includes("coquille") || S.flags.includes("mort_coquille"))) ids.push("croissant");
  const team = ids.map(c => medHtml("c", c, c === "croissant" ? CROISSANT.name : M.companions[c].name)).join("");
  const items = heldItems(), held = items.map(f => medHtml("o", f, M.items[f].name)).join("");
  return `<div class="side-box"><h3>Ton équipe${ids.length ? ` (${ids.length})` : ""}</h3>${team ? `<div class="meds">${team}</div>` : `<p class="empty">Personne ne t'accompagne pour l'instant.</p>`}</div>
    <div class="side-box"><h3>Tes objets${items.length ? ` (${items.length})` : ""}</h3>${held ? `<div class="meds">${held}</div>` : `<p class="empty">Rien encore. Il y a ${Object.keys(M.items).length} objets à trouver.</p>`}</div>
`;
}
/* fiche au survol (ou au toucher) d'un médaillon */
function showCard(el){
  const c = medCard(el.dataset.k, el.dataset.id), card = $("#card");
  card.className = c.round ? "rond" : "carre";
  card.innerHTML = `<span class="big" style="background-image:url('${c.img}')"></span><div class="info"><span class="sp">${esc(c.sp)}</span><h2>${esc(c.name)}</h2>${c.rows.map(([l, t]) => `<p><span class="lab">${l}</span>${esc(t)}</p>`).join("")}</div>`;
  card.hidden = false; cardAt = Date.now();
  const r = el.getBoundingClientRect(), cw = card.offsetWidth, ch = card.offsetHeight, vw = innerWidth, vh = innerHeight;
  let x = r.left - cw - 14; if (x < 16) x = Math.max(16, Math.min(vw - cw - 16, r.left + r.width / 2 - cw / 2));
  let y = x === r.left - cw - 14 ? r.top + r.height / 2 - ch / 2 : r.bottom + 10; if (y + ch > vh - 16) y = Math.max(16, (x === r.left - cw - 14 ? vh - ch - 16 : r.top - ch - 10));
  card.style.left = x + "px"; card.style.top = Math.max(16, y) + "px";
}
function hideCard(){ const c = $("#card"); if (c) c.hidden = true; }
function bindMeds(){
  document.querySelectorAll(".med").forEach(el => {
    el.onmouseenter = el.onfocus = () => showCard(el);
    el.onmouseleave = el.onblur = hideCard;
    el.onclick = e => { e.stopPropagation(); $("#card").hidden ? showCard(el) : hideCard(); };
  });
}
document.addEventListener("click", hideCard);
let cardAt = 0;
addEventListener("scroll", () => { if (Date.now() - cardAt > 400) hideCard(); }, {passive:true});
function linesHtml(n){
  return n.lines.filter(l => allOk(l.if)).map(l => `<p>${esc(l.t)}</p>`).join("");
}
function quipHtml(q){ return q ? `<div class="quip"><b>${esc(M.companions[q.c].name)}</b>${esc(q.t)}</div>` : ""; }
function quipsHtml(a){ return (a || []).map(quipHtml).join(""); }
/* ---------- image du lieu : une par lieu, elle ne change que quand on arrive ailleurs ---------- */
const LIEUX = DATA.lieux;
const locSrc = (img, w) => `img/lieux/${img}${w === 800 ? "-800" : ""}.webp`;
function locFor(id){
  if (!LIEUX) return null;
  const sec = id.split("_")[0];
  const img = LIEUX.n[id] || (S.locSec === sec && S.loc) || LIEUX.d[sec] || S.loc || null;
  S.loc = img; S.locSec = sec; return img;
}
let shownLoc = null;
function showLoc(){
  const img = locFor(S.node), band = $("#locBand");
  if (!img){ band.hidden = true; return; }
  band.hidden = false;
  if (img === shownLoc) return;
  shownLoc = img;
  const el = $("#locImg");
  el.classList.remove("on");
  el.onload = () => el.classList.add("on");
  el.onerror = () => { band.hidden = true; };
  el.sizes = "(max-width:800px) 100vw, 1180px";
  el.srcset = `${locSrc(img, 800)} 800w, ${locSrc(img)} 1600w`;
  el.src = locSrc(img);
  if (el.complete && el.naturalWidth) el.classList.add("on");
  const bg = new Image(); bg.onload = () => { $("#locBg").style.backgroundImage = `url("${locSrc(img, 800)}")`; }; bg.src = locSrc(img, 800);
}
function prefetchLocs(n){
  if (!LIEUX || !n.choices) return;
  const seen = new Set([S.loc]);
  n.choices.forEach(c => { const t = c.to && N[c.to] ? (LIEUX.n[c.to] || LIEUX.d[c.to.split("_")[0]]) : null;
    if (t && !seen.has(t)){ seen.add(t); const i = new Image(); i.src = locSrc(t, innerWidth <= 1000 ? 800 : 1600); } });
}
function render(rolling){
  showGame();
  showLoc();
  $("#hud").innerHTML = hud();
  $("#side").innerHTML = sideHtml();
  const n = N[S.node];
  let h = `<div>${showIds ? `<div class="node-id">${S.node}</div>` : ""}${n.title ? `<h2 class="node-title">${esc(n.title)}</h2>` : ""}</div>`;
  if (n.end){
    const e = M.endings[n.end];
    const got = store.get("lune.ends", {}); const count = Object.keys(got).length;
    h += `<div class="ending"><div class="num">Fin ${n.end} sur ${Object.keys(M.endings).length} · ${esc(e.kind)}</div><h2>${esc(e.title)}</h2><div class="text">${linesHtml(n)}</div>
      <div class="calc">Fins découvertes : ${count}/${Object.keys(M.endings).length} · ${S.steps} choix dans cette partie</div>
      <div class="row"><button class="btn primary" id="again">Rejouer avec ${esc(shortName(M.playables.find(p=>p.id===S.pc).name))}</button><button class="btn" id="other">Choisir un autre personnage</button></div></div>`;
    $("#scene").innerHTML = h;
    $("#again").onclick = () => newGame(S.pc); $("#other").onclick = showTitle;
    bindHud(); return;
  }
  if (S.phase === "node"){
    if (S.drift && S.drift.length) h += `<div class="drift">La Lune s'éloigne : ${S.drift.map(d=>d.t).join(", ")}</div>`;
    h += `<div class="text">${linesHtml(n)}</div>` + quipsHtml(S.quips);
    const vis = visibleChoices(n);
    h += `<div class="choices">` + vis.map((c, i) => {
      const meta = c.stat === "auto" ? `Sans jet` : (() => { const st = statFor(c); const b = bonusFor(st).reduce((a,x)=>a+x.v,0); return `${SN[st]} · diff. <b>${c.diff}</b> · ${chance(c.diff,b)} %`; })();
      const tag = gateTag(c);
      return `<button class="choice" data-i="${i}"><span class="lbl">${esc(c.label)}</span><span class="meta">${meta}</span>${tag ? `<span class="tag">${esc(tag)}</span>` : ""}</button>`;
    }).join("") + `</div>`;
    const hiddenN = n.choices.length - vis.length;
    if (hiddenN > 0) h += `<div class="hidden-count">${hiddenN} autre${hiddenN>1?"s":""} possibilité${hiddenN>1?"s":""} ici, pour d'autres compagnons ou d'autres vies.</div>`;
    $("#scene").innerHTML = h;
    document.querySelectorAll(".choice").forEach(b => b.onclick = () => choose(+b.dataset.i));
    prefetchLocs(n);
  } else {
    const r = S.roll;
    if (r.auto){
      h += `<div class="eyebrow">${esc(r.label)}</div><div id="res"><p class="outcome">${esc(r.text)}</p>${r.log.length?`<div class="fx">${r.log.map(l=>`<span class="${l.p?"p":"m"}">${esc(l.t)}</span>`).join("")}</div>`:""}</div>
      <div class="row"><button class="btn primary" id="next">Continuer</button></div>`;
      $("#scene").innerHTML = h;
      $("#next").onclick = () => { S.prev = r.from || S.node; S.last = "ok"; enterNode(r.to); };
      bindHud(); return;
    }
    h += `<div class="eyebrow">${esc(r.label)}</div>
      <div class="roll"><div class="die ${r.ok?"ok":"ko"} ${rolling?"spin":""}" id="die">${rolling?"?":r.die}</div>
      <div><div class="verdict ${r.ok?"ok":"ko"}" id="verdict" ${rolling?"hidden":""}>${r.ok?(r.die===20?"RÉUSSITE · 20 NATUREL":"RÉUSSITE"):(r.die===1?"ÉCHEC · 1 NATUREL":"ÉCHEC")}</div>
      <div class="calc">d20 <b id="dv">${rolling?"…":r.die}</b> ${r.parts.map(p=>`${p.v>=0?"+":"−"} ${Math.abs(p.v)} ${esc(p.l)}`).join(" ")} = ${rolling?"…":r.die+r.bonus} contre ${r.diff}</div>
      <div id="res" ${rolling?"hidden":""}><p class="outcome">${esc(r.text)}</p>${r.log.length?`<div class="fx">${r.log.map(l=>`<span class="${l.p?"p":"m"}">${esc(l.t)}</span>`).join("")}</div>`:""}</div></div></div>
      <div id="react" ${rolling?"hidden":""}>${quipHtml(r.react)}</div>
      <div class="row"><button class="btn primary" id="next" ${rolling?"hidden":""}>Continuer</button></div>`;
    $("#scene").innerHTML = h;
    $("#next").onclick = () => { S.prev = r.from || S.node; S.last = r.ok ? "ok" : "ko"; enterNode(r.to); };
    if (rolling){
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let t = 0; const die = $("#die");
      const iv = setInterval(() => { die.textContent = 1 + Math.floor(Math.random()*20); if (++t > 8 || reduce){ clearInterval(iv); finish(); } }, 75);
      function finish(){ die.textContent = r.die; $("#dv").textContent = r.die; die.classList.remove("spin");
        document.querySelector(".calc").innerHTML = `d20 <b>${r.die}</b> ${r.parts.map(p=>`${p.v>=0?"+":"−"} ${Math.abs(p.v)} ${esc(p.l)}`).join(" ")} = <b>${r.die+r.bonus}</b> contre ${r.diff}`;
        ["#verdict","#res","#react","#next"].forEach(s => $(s).hidden = false); $("#next").focus(); }
    }
  }
  bindHud();
}
function bindHud(){
  const b = id => document.getElementById(id);
  if (b("tIds")) b("tIds").onclick = () => { showIds = !showIds; store.set("lune.ids", showIds); render(); };
  if (b("tWho")) b("tWho").onclick = () => { openSheet(S.pc, true); };
  bindMeds();
}

/* ---------- objets tenus ---------- */
function heldItems(){ return S && M.items ? S.flags.filter(f => M.items[f]) : []; }

/* ---------- démarrage ---------- */
$("#btnResume").onclick = () => { const s = store.get("lune.save", null); if (s){ S = s; if (!N[S.node]) return showTitle(); render(); } };
renderCast(); bindTabs();
if (DATA.accueil) $("#stage").style.backgroundImage = `url(${DATA.accueil})`;
</script>
